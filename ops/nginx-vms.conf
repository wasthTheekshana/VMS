# VMS - add these two server blocks to ~/dok-stack/nginx/nginx.conf (before the default catch-all).
# The shared nginx container must be on the docker network `shared-nginx` to resolve vms-web / vms-api.

# vms - HTTP redirect
server {
    listen 80;
    server_name vms.testsys.shop;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# vms - HTTPS
server {
    listen 443 ssl;
    server_name vms.testsys.shop;
    ssl_certificate     /etc/letsencrypt/live/vms.testsys.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vms.testsys.shop/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 1m;   # the app has no file uploads; JSON bodies are tiny

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location ~ /\.env { deny all; return 404; }

    # REST API (routes already start with /api, so no trailing slash on proxy_pass)
    location /api/ {
        proxy_pass         http://vms-api:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;   # PDF / Excel exports can take a few seconds
    }

    # Live alerts: Socket.IO over WebSocket
    location /ws/ {
        proxy_pass         http://vms-api:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    # Web app
    location / {
        proxy_pass         http://vms-web:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}
